name: Release

# Builds a signed release APK and publishes it to the public downloads repo
# (Continuous-Path/HeadBoard-Releases) so the website's download link always
# serves the newest build. Triggers: push a `v*` tag, or run manually from
# the Actions tab. Mirrors JustType's release pipeline (JustType1 repo,
# docs/release.md there) — same team signing key, same secrets names.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JUSTTYPE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::JUSTTYPE_KEYSTORE_BASE64 secret is not set'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/justtype-release.jks"

      - name: Build signed release APK
        working-directory: HeadBoard
        env:
          ORG_GRADLE_PROJECT_JUSTTYPE_KEYSTORE_FILE: ${{ runner.temp }}/justtype-release.jks
          ORG_GRADLE_PROJECT_JUSTTYPE_KEYSTORE_PASSWORD: ${{ secrets.JUSTTYPE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_JUSTTYPE_KEY_PASSWORD: ${{ secrets.JUSTTYPE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Refuse to publish a debug- or platform-signed APK
        run: |
          APK=HeadBoard/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -Eq 'CN=Android Debug|android@android\.com' /tmp/certs.txt; then
            echo '::error::build fell back to the DEBUG/platform key — check the signing secrets'
            exit 1
          fi

      - name: Publish to Continuous-Path/HeadBoard-Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Manual runs: derive a unique tag from versionName + run number.
            VERSION="$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' HeadBoard/app/build.gradle)"
            TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          fi
          cp HeadBoard/app/build/outputs/apk/release/app-release.apk "headboard-${TAG}.apk"
          cp HeadBoard/app/build/outputs/apk/release/app-release.apk headboard.apk
          # headboard.apk on every release keeps the stable website link working:
          # https://github.com/Continuous-Path/HeadBoard-Releases/releases/latest/download/headboard.apk
          gh release create "$TAG" \
            --repo Continuous-Path/HeadBoard-Releases \
            --title "HeadBoard $TAG" \
            --notes "Signed HeadBoard release build ($TAG)." \
            "headboard-${TAG}.apk" headboard.apk \
          || gh release upload "$TAG" \
            --repo Continuous-Path/HeadBoard-Releases \
            --clobber "headboard-${TAG}.apk" headboard.apk
