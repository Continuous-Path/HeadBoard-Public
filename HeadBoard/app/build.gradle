plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}


project.ext.ASSET_DIR = projectDir.toString() + '/src/main/assets'

// Release signing — the shared Continuous Path team key (same key as JustType and
// OpenBoard; JUSTTYPE_* names kept for consistency with that setup). A machine set
// up once via JustType's `./jt signing-setup` has the keystore at
// ~/.justtype/justtype-release.jks and the password in the macOS Keychain (service
// 'justtype-signing'). CI overrides via JUSTTYPE_KEYSTORE_FILE +
// JUSTTYPE_KEYSTORE_PASSWORD/JUSTTYPE_KEY_PASSWORD gradle properties (repo secrets).
// An unconfigured machine produces an UNSIGNED release rather than falling back to
// another key: a silent substitution is how a wrongly-signed APK actually ships. CI
// additionally fails if the secret is missing and re-checks the certificate on the
// output (see .github/workflows/release.yml).
// Debug builds use AGP's default debug keystore. OpenBoard declares a signature-level
// RECEIVE_HEADBOARD_EVENT permission but never applies it to anything, so the two apps
// do not need matching keys to talk.
def releaseStoreFile = file(providers.gradleProperty('JUSTTYPE_KEYSTORE_FILE')
    .getOrElse("${System.getProperty('user.home')}/.justtype/justtype-release.jks"))
def keychainPassword = {
    if (!System.getProperty('os.name').toLowerCase().contains('mac')) return null
    def exec = providers.exec {
        commandLine 'security', 'find-generic-password', '-s', 'justtype-signing', '-w'
        ignoreExitValue = true
    }
    exec.result.get().exitValue == 0 ? exec.standardOutput.asText.get().trim() : null
}
def releaseStorePassword = providers.gradleProperty('JUSTTYPE_KEYSTORE_PASSWORD').orNull ?: keychainPassword()
// PKCS12 keystores use a single password for store and key.
def releaseKeyPassword = providers.gradleProperty('JUSTTYPE_KEY_PASSWORD').orNull ?: releaseStorePassword
def hasReleaseSigning = releaseStoreFile.exists() && releaseStorePassword != null && releaseKeyPassword != null

android {
    namespace 'org.continuouspath.headboard'
    compileSdk 34

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias 'justtype'
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'org.continuouspath.headboard'
        minSdk 28
        targetSdk 34
        versionCode 32
        versionName "1.0.0"

//        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        proguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            // minify stays OFF — R8 crashed HeadBoard at runtime; stability over APK size.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Deliberately left unsigned when unconfigured — see the note above.
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        aidl true
        // BuildConfig.DEBUG gates hot-path logging (stripped in release builds).
        buildConfig true
    }

    // Ensure AIDL sources are picked up explicitly
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}


dependencies {
    // Pinned: 'latest.release' floats, so the version (and the licence we audited) could
    // change between builds without anyone noticing. Build-time only, not redistributed.
    annotationProcessor 'com.google.auto.value:auto-value:1.11.1'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    // androidx.test belongs to the test source set only. Shipping it put test code in the
    // production APK and contributed an INTERNET permission the app does not want.
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.mediapipe:tasks-vision:0.10.8'

    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation("org.jetbrains.kotlin:kotlin-reflect:2.0.0")

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test.ext:junit:1.1.3'
    testImplementation 'androidx.test:runner:1.4.0'
    testImplementation 'androidx.test:rules:1.4.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.2.0'

}
